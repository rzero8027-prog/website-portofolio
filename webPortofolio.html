<!DOCTYPE html>
<html lang="id">
<head>

    <title>Halaman Profil Saya</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 20px;
            color: #333;
        }
        .card {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
        }
        ul {
            line-height: 1.6;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2980b9;
        }

</head>
<body>

    <div class="card">
        <h1>Halo, Saya Budi!</h1>
        <p>Selamat datang di halaman web sederhana saya. Saya sedang belajar pemrograman web.</p>

        <h3>Hobi Saya:</h3>
        <ul>
            <li>Membaca buku</li>
            <li>Koding</li>
            <li>Bermain musik</li>

        <button onclick="alert('Terima kasih sudah berkunjung!')">Klik Saya</button>
    </div>

</body>
</html>
